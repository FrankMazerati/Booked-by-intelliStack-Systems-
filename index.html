<!-- CATEGORY WORLDS (ORDERED STARTING WITH FOOD & DRINKS) -->
<h3 style="font-size: 0.9rem; margin-top: 14px; margin-bottom: 4px;">Select Category World</h3>
<p style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px;">Tap a world to filter and re-theme your environment:</p>

<div class="category-grid">
  <!-- 1. FOOD & DRINKS (TOP PRIORITY) -->
  <div class="category-chip" data-cat="yellow" onclick="enterCategoryWorld('yellow', 'Food & Dining')">
    <div class="icon-avatar">🍔</div>
    <span>Food & Drinks</span>
  </div>

  <!-- 2. SALONS & LASHES -->
  <div class="category-chip" data-cat="pink" onclick="enterCategoryWorld('pink', 'Salons & Lashes')">
    <div class="icon-avatar">💅</div>
    <span>Salons</span>
  </div>

  <!-- 3. BARBERS & GROOMING -->
  <div class="category-chip" data-cat="blue" onclick="enterCategoryWorld('blue', 'Barbers & Grooming')">
    <div class="icon-avatar">💈</div>
    <span>Barbers</span>
  </div>

  <!-- 4. SPA & WELLNESS -->
  <div class="category-chip" data-cat="purple" onclick="enterCategoryWorld('purple', 'Spa & Wellness')">
    <div class="icon-avatar">🧘</div>
    <span>Spa</span>
  </div>
</div>
