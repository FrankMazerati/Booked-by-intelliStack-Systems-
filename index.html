<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b16">
  <meta name="description" content="BOOKED — Real people. Real services. Real time.">
  <title>BOOKED — More Than Appointments</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #090b16;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #app {
      min-height: 100vh;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 95px;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* TOP BAR */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 22, .95);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .topbar-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      background: transparent;
      color: #fff;
      padding: 0;
      font-weight: 900;
      letter-spacing: .08em;
      font-size: 20px;
    }

    .brand-mark {
      width: 43px;
      height: 43px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      box-shadow: 0 10px 30px rgba(139,92,246,.35);
      font-size: 22px;
    }

    .profile-button {
      width: 43px;
      height: 43px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: #fff;
    }

    /* HERO */

    .hero {
      padding: 70px 0 45px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #a78bfa;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(46px, 9vw, 78px);
      line-height: .96;
      letter-spacing: -.06em;
    }

    .hero h1 span {
      color: #a78bfa;
    }

    .hero p.description {
      max-width: 650px;
      color: #a9adbd;
      font-size: 18px;
      line-height: 1.65;
      margin: 22px 0 28px;
    }

    /* SEARCH */

    .search {
      max-width: 680px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 18px;
      background: #131625;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 17px;
    }

    .search-icon {
      color: #a78bfa;
      font-size: 23px;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 16px;
    }

    .search input::placeholder {
      color: #74798d;
    }

    /* SECTIONS */

    .section {
      padding: 30px 0;
    }

    .section-heading {
      margin-bottom: 20px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 29px;
      letter-spacing: -.035em;
    }

    /* CATEGORY CARDS */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .category-card {
      min-height: 150px;
      text-align: left;
      padding: 22px;
      border-radius: 21px;
      border: 1px solid rgba(255,255,255,.08);
      background:
        linear-gradient(
          145deg,
          rgba(139,92,246,.17),
          rgba(236,72,153,.07)
        );
      color: #fff;
      transition: .2s ease;
    }

    .category-card:hover {
      transform: translateY(-4px);
      border-color: rgba(167,139,250,.55);
    }

    .category-icon {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      margin-bottom: 17px;
      border-radius: 15px;
      background: linear-gradient(
        135deg,
        rgba(139,92,246,.28),
        rgba(236,72,153,.2)
      );
      color: #ddd0ff;
      font-size: 22px;
      font-weight: 900;
    }

    .category-card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 7px;
    }

    .category-card small {
      display: block;
      color: #969bad;
      line-height: 1.45;
    }

    /* SERVICE CARDS */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .service-card {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      background: #111422;
    }

    .service-image {
      height: 145px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at 30% 30%,
          rgba(139,92,246,.35),
          transparent 45%
        ),
        linear-gradient(135deg, #15182a, #1d1325);
      color: #c4b5fd;
      font-size: 38px;
    }

    .service-content {
      padding: 19px;
    }

    .service-content h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .service-content p {
      margin: 0 0 18px;
      color: #9297aa;
    }

    /* BUSINESS */

    .business-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .business-card {
      overflow: hidden;
      background: #111422;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
    }

    .business-image {
      height: 180px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(236,72,153,.3),
          transparent 40%
        ),
        linear-gradient(135deg, #17192a, #21152b);
      color: #c4b5fd;
      font-weight: 900;
      letter-spacing: .15em;
    }

    .business-content {
      padding: 20px;
    }

    .business-meta {
      display: flex;
      justify-content: space-between;
      color: #8f94a7;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .business-content h3 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .business-content p {
      color: #9498aa;
      line-height: 1.55;
      margin: 0 0 17px;
    }

    /* BUTTONS */

    .primary-button,
    .secondary-button {
      border-radius: 13px;
      padding: 13px 19px;
      font-weight: 800;
      transition: .18s ease;
    }

    .primary-button {
      border: 0;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff;
      box-shadow: 0 12px 28px rgba(139,92,246,.24);
    }

    .secondary-button {
      background: rgba(255,255,255,.07);
      color: #fff;
      border: 1px solid rgba(255,255,255,.1);
    }

    .primary-button:hover,
    .secondary-button:hover {
      transform: translateY(-2px);
    }

    /* PAGE */

    .page {
      padding: 55px 0;
    }

    .page-header {
      margin-bottom: 30px;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 70px);
      letter-spacing: -.055em;
    }

    .page-header p {
      max-width: 650px;
      color: #969bad;
      font-size: 17px;
      line-height: 1.6;
    }

    /* DETAIL */

    .back-button {
      border: 0;
      background: transparent;
      color: #b7a8ff;
      padding: 0;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .detail-image {
      height: 280px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background:
        radial-gradient(
          circle at 30% 20%,
          rgba(139,92,246,.4),
          transparent 40%
        ),
        linear-gradient(135deg, #15182a, #27172b);
      font-weight: 900;
      letter-spacing: .2em;
      margin-bottom: 25px;
    }

    .detail h1 {
      font-size: clamp(35px, 6vw, 58px);
      margin: 0 0 10px;
      letter-spacing: -.04em;
    }

    .muted {
      color: #9297aa;
    }

    /* BOOKING */

    .booking-panel {
      max-width: 700px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      background: #111422;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: #090b16;
      color: #fff;
      outline: none;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .time-button {
      padding: 12px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.09);
      background: #191c2a;
      color: #fff;
    }

    .time-button.selected {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-color: transparent;
    }

    /* CONFIRMATION */

    .confirmation {
      max-width: 650px;
      margin: 50px auto;
      text-align: center;
    }

    .confirmation-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      font-size: 32px;
      font-weight: 900;
    }

    .confirmation h1 {
      font-size: 48px;
      margin: 0 0 15px;
    }

    .confirmation-card {
      text-align: left;
      margin: 30px 0;
      padding: 22px;
      border-radius: 20px;
      background: #111422;
      border: 1px solid rgba(255,255,255,.08);
    }

    .confirmation-card div {
      padding: 8px 0;
      color: #a2a6b7;
    }

    .confirmation-card strong {
      color: #fff;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      padding: 70px 20px;
      border: 1px dashed rgba(255,255,255,.12);
      border-radius: 22px;
      color: #9297aa;
    }

    .empty h2 {
      color: #fff;
    }

    /* NAV */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 15px;
      transform: translateX(-50%);
      z-index: 100;
      width: min(560px, calc(100% - 30px));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 7px;
      background: rgba(17,20,34,.94);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .nav-button {
      border: 0;
      border-radius: 14px;
      padding: 10px;
      background: transparent;
      color: #85899b;
    }

    .nav-button span {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .nav-button small {
      font-size: 11px;
    }

    .nav-button.active {
      color: #fff;
      background: rgba(139,92,246,.18);
    }

    .results-count {
      color: #85899b;
      margin-bottom: 20px;
    }

    @media (max-width: 800px) {
      .category-grid,
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .business-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .container {
        width: calc(100% - 22px);
      }

      .hero {
        padding-top: 45px;
      }

      .category-grid,
      .cards {
        grid-template-columns: 1fr;
      }

      .time-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1,
      .page-header h1 {
        font-size: 46px;
      }
    }
  </style>
</head>

<body>

  <div id="app"></div>

  <script>
    (() => {

      const categories = [
        {
          id: "beauty",
          name: "Hair & Beauty",
          icon: "✦",
          description: "Hair, beauty and personal style.",
          services: [
            "Women's Haircut",
            "Blowout",
            "Hair Color"
          ]
        },
        {
          id: "fitness",
          name: "Fitness",
          icon: "✦",
          description: "Training, classes and movement.",
          services: [
            "Personal Training",
            "Boxing",
            "Yoga Session"
          ]
        },
        {
          id: "nails",
          name: "Nails",
          icon: "✦",
          description: "Manicures, sets and nail art.",
          services: [
            "Gel Manicure",
            "Acrylic Set",
            "Nail Art"
          ]
        },
        {
          id: "barbers",
          name: "Barbers",
          icon: "✦",
          description: "Cuts, fades and beard services.",
          services: [
            "Men's Haircut",
            "Beard Trim",
            "Skin Fade"
          ]
        },
        {
          id: "makeup",
          name: "Makeup",
          icon: "✦",
          description: "Glam, soft glam and lessons.",
          services: [
            "Full Glam",
            "Soft Glam",
            "Makeup Lesson"
          ]
        },
        {
          id: "more",
          name: "More",
          icon: "✦",
          description: "Massage, photography and more.",
          services: [
            "Massage",
            "Photography",
            "Tattoo Session"
          ]
        }
      ];

      const businesses = [
        {
          id: 1,
          category: "beauty",
          name: "Glow Studio",
          location: "Downtown",
          rating: "4.9",
          description: "Premium beauty services and personal styling."
        },
        {
          id: 2,
          category: "fitness",
          name: "Upper Level Fitness",
          location: "Midtown",
          rating: "4.9",
          description: "Personal training and high-energy workouts."
        },
        {
          id: 3,
          category: "barbers",
          name: "The Cut House",
          location: "Downtown",
          rating: "4.8",
          description: "Modern cuts, fades and grooming."
        },
        {
          id: 4,
          category: "nails",
          name: "Diamond Nails",
          location: "Uptown",
          rating: "4.8",
          description: "Premium nail care and custom nail art."
        }
      ];

      const times = [
        "9:00 AM",
        "10:00 AM",
        "11:00 AM",
        "12:00 PM",
        "1:00 PM",
        "2:00 PM",
        "3:00 PM",
        "4:00 PM",
        "5:00 PM",
        "6:00 PM",
        "7:00 PM",
        "8:00 PM"
      ];

      let selectedCategory = categories[0];
      let selectedBusiness = null;
      let selectedService = null;
      let selectedDate = "";
      let selectedTime = "";
      let currentPage = "home";

      let bookings = [];

      try {
        bookings = JSON.parse(
          localStorage.getItem("booked_bookings") || "[]"
        );
      } catch {
        bookings = [];
      }

      function saveBookings() {
        localStorage.setItem(
          "booked_bookings",
          JSON.stringify(bookings)
        );
      }

      function escapeHTML(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function today() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function formatDate(value) {
        if (!value) return "";

        const date = new Date(value + "T12:00:00");

        return date.toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        });
      }

      function shell(content, active = "home") {
        return `
          <div class="app">

            <header class="topbar">
              <div class="container topbar-inner">

                <button
                  class="brand"
                  data-action="home"
                >
                  <span class="brand-mark">B</span>
                  <span>BOOKED</span>
                </button>

                <button
                  class="profile-button"
                  data-action="bookings"
                  aria-label="Bookings"
                >
                  ✓
                </button>

              </div>
            </header>

            ${content}

            <nav class="bottom-nav">

              <button
                class="nav-button ${active === "home" ? "active" : ""}"
                data-action="home"
              >
                <span>⌂</span>
                <small>Home</small>
              </button>

              <button
                class="nav-button ${active === "search" ? "active" : ""}"
                data-action="search"
              >
                <span>⌕</span>
                <small>Search</small>
              </button>

              <button
                class="nav-button ${active === "bookings" ? "active" : ""}"
                data-action="bookings"
              >
                <span>✓</span>
                <small>Bookings</small>
              </button>

            </nav>

          </div>
        `;
      }

      function renderHome() {

        const category = selectedCategory;

        return shell(`
          <main class="container">

            <section class="hero">

              <p class="eyebrow">BOOKED</p>

              <h1>
                Find it.
                <span>Book it.</span>
              </h1>

              <p class="description">
                Discover services, businesses and experiences
                and book your time in seconds.
              </p>

              <div class="search">
                <span class="search-icon">⌕</span>

                <input
                  id="home-search"
                  type="search"
                  placeholder="Search services, businesses..."
                >
              </div>

            </section>

            <section class="section">

              <div class="section-heading">
                <p class="eyebrow">DISCOVER</p>
                <h2>Browse Categories</h2>
              </div>

              <div class="category-grid">

                ${categories.map((item, index) => `
                  <button
                    class="category-card"
                    data-category="${index}"
                  >

                    <span class="category-icon">
                      ${item.icon}
                    </span>

                    <strong>
                      ${escapeHTML(item.name)}
                    </strong>

                    <small>
                      ${escapeHTML(item.description)}
                    </small>

                  </button>
                `).join("")}

              </div>

            </section>

            <section class="section">

              <div class="section-heading">
                <p class="eyebrow">POPULAR</p>
                <h2>
                  Popular ${escapeHTML(category.name)}
                </h2>
              </div>

              <div class="cards">

                ${category.services.map(service => `
                  <article class="service-card">

                    <div class="service-image">
                      ✦
                    </div>

                    <div class="service-content">

                      <h3>
                        ${escapeHTML(service)}
                      </h3>

                      <p>
                        Book a local professional.
                      </p>

                      <button
                        class="primary-button"
                        data-service="${escapeHTML(service)}"
                      >
                        Book Now
                      </button>

                    </div>

                  </article>
                `).join("")}

              </div>

            </section>

            <section class="section">

              <div class="section-heading">
                <p class="eyebrow">FEATURED</p>
                <h2>Popular Businesses</h2>
              </div>

              <div class="business-grid">

                ${businesses.map(business => `
                  <article class="business-card">

                    <div class="business-image">
                      BOOKED
                    </div>

                    <div class="business-content">

                      <div class="business-meta">
                        <span>
                          ${escapeHTML(business.location)}
                        </span>

                        <span>
                          ★ ${escapeHTML(business.rating)}
                        </span>
                      </div>

                      <h3>
                        ${escapeHTML(business.name)}
                      </h3>

                      <p>
                        ${escapeHTML(business.description)}
                      </p>

                      <button
                        class="secondary-button"
                        data-business="${business.id}"
                      >
                        View Business
                      </button>

                    </div>

                  </article>
                `).join("")}

              </div>

            </section>

          </main>
        `, "home");
      }

      function renderSearch(query = "") {

        const q = query.trim().toLowerCase();

        const results = [
          ...businesses.map(b => ({
            type: "business",
            value: b,
            text: `${b.name} ${b.location} ${b.description}`
          })),
          ...categories.flatMap(c =>
            c.services.map(service => ({
              type: "service",
              value: {
                service,
                category: c
              },
              text: `${service} ${c.name}`
            }))
          )
        ].filter(item =>
          !q || item.text.toLowerCase().includes(q)
        );

        return shell(`
          <main class="container page">

            <div class="page-header">

              <p class="eyebrow">SEARCH</p>

              <h1>Find what you need.</h1>

              <p>
                Search BOOKED for services and businesses.
              </p>

              <div class="search">
                <span class="search-icon">⌕</span>

                <input
                  id="search-page-input"
                  type="search"
                  value="${escapeHTML(query)}"
                  placeholder="Search BOOKED..."
                >
              </div>

            </div>

            <p class="results-count">
              ${results.length} result${results.length === 1 ? "" : "s"}
            </p>

            <div class="business-grid">

              ${results.length ? results.map(item => {

                if (item.type === "business") {

                  const b = item.value;

                  return `
                    <article class="business-card">

                      <div class="business-image">
                        BOOKED
                      </div>

                      <div class="business-content">

                        <div class="business-meta">
                          <span>${escapeHTML(b.location)}</span>
                          <span>★ ${escapeHTML(b.rating)}</span>
                        </div>

                        <h3>${escapeHTML(b.name)}</h3>

                        <p>
                          ${escapeHTML(b.description)}
                        </p>

                        <button
                          class="secondary-button"
                          data-business="${b.id}"
                        >
                          View Business
                        </button>

                      </div>

                    </article>
                  `;
                }

                return `
                  <article class="service-card">

                    <div class="service-image">
                      ✦
                    </div>

                    <div class="service-content">

                      <p class="eyebrow">
                        ${escapeHTML(item.value.category.name)}
                      </p>

                      <h3>
                        ${escapeHTML(item.value.service)}
                      </h3>

                      <p>
                        Find a professional offering this service.
                      </p>

                      <button
                        class="primary-button"
                        data-service="${escapeHTML(item.value.service)}"
                      >
                        Book Now
                      </button>

                    </div>

                  </article>
                `;

              }).join("") : `

                <div class="empty">
                  <h2>No results yet</h2>
                  <p>
                    Try another service or business name.
                  </p>
                </div>

              `}

            </div>

          </main>
        `, "search");
      }

      function renderBusiness() {

        const b = selectedBusiness;

        if (!b) {
          return renderHome();
        }

        const category =
          categories.find(c => c.id === b.category);

        return shell(`
          <main class="container page">

            <button
              class="back-button"
              data-action="home"
            >
              ← Back to BOOKED
            </button>

            <div class="detail-image">
              BOOKED
            </div>

            <div class="detail">

              <p class="eyebrow">
                ${escapeHTML(category?.name || "BUSINESS")}
              </p>

              <h1>
                ${escapeHTML(b.name)}
              </h1>

              <p class="muted">
                ${escapeHTML(b.location)}
                &nbsp; • &nbsp;
                ★ ${escapeHTML(b.rating)}
              </p>

              <p class="muted">
                ${escapeHTML(b.description)}
              </p>

            </div>

            <section class="section">

              <div class="section-heading">
                <p class="eyebrow">SERVICES</p>
                <h2>Choose a service</h2>
              </div>

              <div class="cards">

                ${(category?.services || []).map(service => `
                  <article class="service-card">

                    <div class="service-image">
                      ✦
                    </div>

                    <div class="service-content">

                      <h3>
                        ${escapeHTML(service)}
                      </h3>

                      <p>
                        Available at ${escapeHTML(b.name)}.
                      </p>

                      <button
                        class="primary-button"
                        data-service="${escapeHTML(service)}"
                      >
                        Book Now
                      </button>

                    </div>

                  </article>
                `).join("")}

              </div>

            </section>

          </main>
        `);
      }

      function renderBooking() {

        if (!selectedBusiness) {

          selectedBusiness = businesses[0];
        }

        const b = selectedBusiness;

        if (!selectedService) {
          selectedService = "Appointment";
        }

        return shell(`
          <main class="container page">

            <button
              class="back-button"
              data-action="business"
            >
              ← Back
            </button>

            <div class="page-header">

              <p class="eyebrow">BOOK APPOINTMENT</p>

              <h1>
                ${escapeHTML(selectedService)}
              </h1>

              <p>
                ${escapeHTML(b.name)}
              </p>

            </div>

            <div class="booking-panel">

              <div class="form-group">

                <label for="booking-date">
                  Choose a date
                </label>

                <input
                  id="booking-date"
                  class="form-input"
                  type="date"
                  min="${today()}"
                  value="${escapeHTML(selectedDate)}"
                >

              </div>

              <div class="form-group">

                <label>
                  Choose a time
                </label>

                <div class="time-grid">

                  ${times.map(time => `
                    <button
                      class="time-button ${
                        selectedTime === time
                          ? "selected"
                          : ""
                      }"
                      data-time="${escapeHTML(time)}"
                    >
                      ${escapeHTML(time)}
                    </button>
                  `).join("")}

                </div>

              </div>

              <button
                class="primary-button"
                id="confirm-booking"
                style="width:100%;"
                ${selectedDate && selectedTime ? "" : "disabled"}
              >
                Confirm Booking
              </button>

            </div>

          </main>
        `);
      }

      function renderBookings() {

        return shell(`
          <main class="container page">

            <div class="page-header">

              <p class="eyebrow">YOUR BOOKED APPOINTMENTS</p>

              <h1>Your Bookings</h1>

              <p>
                Keep track of the appointments you've booked
                through BOOKED.
              </p>

            </div>

            ${
              bookings.length
                ? `
                  <div class="business-grid">

                    ${bookings.map((booking, index) => `
                      <article class="business-card">

                        <div class="business-image">
                          BOOKED
                        </div>

                        <div class="business-content">

                          <div class="business-meta">
                            <span>Confirmed</span>
                            <span>✓</span>
                          </div>

                          <h3>
                            ${escapeHTML(booking.service)}
                          </h3>

                          <p>
                            ${escapeHTML(booking.business)}
                          </p>

                          <p>
                            ${escapeHTML(booking.date)}
                            <br>
                            ${escapeHTML(booking.time)}
                          </p>

                          <button
                            class="secondary-button"
                            data-cancel="${index}"
                          >
                            Cancel Booking
                          </button>

                        </div>

                      </article>
                    `).join("")}

                  </div>
                `
                : `
                  <div class="empty">

                    <h2>No bookings yet</h2>

                    <p>
                      When you book a service,
                      it will appear here.
                    </p>

                    <button
                      class="primary-button"
                      data-action="home"
                    >
                      Start Booking
                    </button>

                  </div>
                `
            }

          </main>
        `, "bookings");
      }

      function renderConfirmation(booking) {

        return shell(`
          <main class="container">

            <div class="confirmation">

              <div class="confirmation-icon">
                ✓
              </div>

              <p class="eyebrow">
                BOOKING CONFIRMED
              </p>

              <h1>
                You're BOOKED.
              </h1>

              <p class="muted">
                Your appointment has been saved.
              </p>

              <div class="confirmation-card">

                <div>
                  Service:
                  <strong>
                    ${escapeHTML(booking.service)}
                  </strong>
                </div>

                <div>
                  Business:
                  <strong>
                    ${escapeHTML(booking.business)}
                  </strong>
                </div>

                <div>
                  Date:
                  <strong>
                    ${escapeHTML(booking.date)}
                  </strong>
                </div>

                <div>
                  Time:
                  <strong>
                    ${escapeHTML(booking.time)}
                  </strong>
                </div>

              </div>

              <button
                class="primary-button"
                data-action="bookings"
              >
                View My Bookings
              </button>

              <button
                class="secondary-button"
                data-action="home"
                style="margin-left:8px;"
              >
                Back Home
              </button>

            </div>

          </main>
        `);
      }

      function render() {

        let html = "";

        if (currentPage === "home") {
          html = renderHome();
        }

        if (currentPage === "search") {
          html = renderSearch(window.bookedSearchQuery || "");
        }

        if (currentPage === "business") {
          html = renderBusiness();
        }

        if (currentPage === "booking") {
          html = renderBooking();
        }

        if (currentPage === "bookings") {
          html = renderBookings();
        }

        if (currentPage === "confirmation") {
          html = renderConfirmation(window.lastBooking);
        }

        document.getElementById("app").innerHTML = html;

        attachEvents();
      }

      function goHome() {
        selectedBusiness = null;
        selectedService = null;
        selectedDate = "";
        selectedTime = "";
        currentPage = "home";
        render();
        window.scrollTo(0, 0);
      }

      function openBusiness(id) {

        selectedBusiness =
          businesses.find(b => b.id === Number(id)) || null;

        if (!selectedBusiness) return;

        selectedService = null;
        selectedDate = "";
        selectedTime = "";
        currentPage = "business";

        render();
        window.scrollTo(0, 0);
      }

      function openBooking(service) {

        selectedService = service;

        if (!selectedBusiness) {
          selectedBusiness = businesses.find(
            b => b.category === selectedCategory.id
          ) || businesses[0];
        }

        selectedDate = "";
        selectedTime = "";
        currentPage = "booking";

        render();
        window.scrollTo(0, 0);
      }

      function attachEvents() {

        document.querySelectorAll("[data-action]").forEach(button => {

          button.addEventListener("click", () => {

            const action = button.dataset.action;

            if (action === "home") {
              goHome();
            }

            if (action === "search") {
              window.bookedSearchQuery = "";
              currentPage = "search";
              render();
              window.scrollTo(0, 0);
            }

            if (action === "bookings") {
              currentPage = "bookings";
              render();
              window.scrollTo(0, 0);
            }

            if (action === "business") {
              currentPage = "business";
              render();
              window.scrollTo(0, 0);
            }

          });

        });

        document.querySelectorAll("[data-category]").forEach(button => {

          button.addEventListener("click", () => {

            selectedCategory =
              categories[Number(button.dataset.category)];

            render();
            window.scrollTo(0, 0);

          });

        });

        document.querySelectorAll("[data-business]").forEach(button => {

          button.addEventListener("click", () => {

            openBusiness(button.dataset.business);

          });

        });

        document.querySelectorAll("[data-service]").forEach(button => {

          button.addEventListener("click", () => {

            openBooking(button.dataset.service);

          });

        });

        document.querySelectorAll("[data-time]").forEach(button => {

          button.addEventListener("click", () => {

            selectedTime = button.dataset.time;

            render();

          });

        });

        const dateInput =
          document.getElementById("booking-date");

        if (dateInput) {

          dateInput.addEventListener("change", event => {

            selectedDate = event.target.value;

            render();

          });

        }

        const confirmButton =
          document.getElementById("confirm-booking");

        if (confirmButton) {

          confirmButton.addEventListener("click", () => {

            if (!selectedDate || !selectedTime) {
              return;
            }

            const booking = {
              id: Date.now(),
              service: selectedService,
              business: selectedBusiness
                ? selectedBusiness.name
                : "BOOKED Professional",
              date: formatDate(selectedDate),
              time: selectedTime,
              createdAt: new Date().toISOString()
            };

            bookings.unshift(booking);
            saveBookings();

            window.lastBooking = booking;

            currentPage = "confirmation";

            render();

            window.scrollTo(0, 0);

          });

        }

        document.querySelectorAll("[data-cancel]").forEach(button => {

          button.addEventListener("click", () => {

            const index = Number(button.dataset.cancel);

            bookings.splice(index, 1);

            saveBookings();

            render();

          });

        });

        const homeSearch =
          document.getElementById("home-search");

        if (homeSearch) {

          homeSearch.addEventListener("keydown", event => {

            if (event.key === "Enter") {

              window.bookedSearchQuery =
                homeSearch.value;

              currentPage = "search";

              render();

              window.scrollTo(0, 0);

            }

          });

        }

        const searchInput =
          document.getElementById("search-page-input");

        if (searchInput) {

          searchInput.addEventListener("keydown", event => {

            if (event.key === "Enter") {

              window.bookedSearchQuery =
                searchInput.value;

              render();

              window.scrollTo(0, 0);

            }

          });

        }

      }

      /* START THE APP */

      render();

    })();
  </script>

</body>
</html>
