<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#050611">

  <title>BOOKED — Real People. Real Services. Real Time.</title>

  <link rel="stylesheet" href="variables.css">
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="responsive.css">
</head>

<body>
  <div id="app"></div>
  <div id="app" aria-live="polite"></div>

  <<script type="module" src="./app.js"></script>
  <div id="app" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
<script>
  fetch("./app.js")
    .then(response => {
      document.getElementById("app").innerHTML = `
        <div style="padding:40px;font-family:Arial;background:white;color:black;min-height:100vh">
          <h1>APP.JS FOUND</h1>
          <p>Status: ${response.status}</p>
          <p>File loaded: ${response.ok}</p>
        </div>
      `;
    })
    .catch(error => {
      document.getElementById("app").innerHTML = `
        <div style="padding:40px;font-family:Arial;background:white;color:red;min-height:100vh">
          <h1>APP.JS NOT FOUND</h1>
          <p>${error}</p>
        </div>
      `;
    });
</script>
