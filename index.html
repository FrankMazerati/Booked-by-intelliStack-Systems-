  <title>BOOKED — More Than Appointments</title>  <style>
    * {
      box-sizing: border-box;

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #090b16;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    #app {
      min-height: 100vh;
    }

    /* =========================
       APP
    ========================= */

    .app {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 11, 22, 0.94);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .topbar-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      font-size: 20px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 10px 30px rgba(139,92,246,.3);
    }

    .profile-button {
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 70px 0 45px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #a78bfa;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .hero h1,
    .page-header h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 76px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .hero h1 span {
      color: #a78bfa;
    }

    .hero p {
      max-width: 620px;
      color: #a9adbd;
      font-size: 18px;
      line-height: 1.65;
      margin: 22px 0 28px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search {
      max-width: 680px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px 18px;
      background: #131625;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 16px;
    }

    .search span {
      color: #a78bfa;
      font-size: 22px;
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
    }

    .search input::placeholder {
      color: #74798d;
    }

    /* =========================
       BUTTONS
    ========================= */

    .primary-button,
    .secondary-button {
      border-radius: 13px;
      padding: 13px 19px;
      font-weight: 800;
      border: 0;
      transition: transform .18s ease, opacity .18s ease;
    }

    .primary-button {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      box-shadow: 0 12px 28px rgba(139,92,246,.24);
    }

    .secondary-button {
      background: rgba(255,255,255,.07);
      color: white;
      border: 1px solid rgba(255,255,255,.1);
    }

    .primary-button:hover,
    .secondary-button:hover {
      transform: translateY(-2px);
    }

    .primary-button:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      padding: 30px 0;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.03em;
    }

    /* =========================
       CATEGORIES
    ========================= */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .category-card {
      min-height: 145px;
      text-align: left;
      padding: 22px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.08);
      background:
        linear-gradient(
          145deg,
          rgba(139,92,246,.16),
          rgba(236,72,153,.07)
        );
      color: white;
      transition: transform .2s ease, border-color .2s ease;
    }

    .category-card:hover {
      transform: translateY(-4px);
      border-color: rgba(167,139,250,.55);
    }

    .category-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin-bottom: 17px;
      border-radius: 14px;
      background: rgba(167,139,250,.14);
      color: #c4b5fd;
      font-size: 22px;
      font-weight: 900;
    }

    .category-card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 7px;
    }

    .category-card small {
      display: block;
      color: #969bad;
      line-height: 1.45;
    }

    /* =========================
       SERVICE CARDS
    ========================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .service-card {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      background: #111422;
    }

    .service-image {
      height: 145px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 30%, rgba(139,92,246,.35), transparent 45%),
        linear-gradient(135deg, #15182a, #1d1325);
      color: #c4b5fd;
      font-size: 38px;
    }

    .service-content {
      padding: 19px;
    }

    .service-content h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .service-content p {
      margin: 0 0 18px;
      color: #9297aa;
    }

    /* =========================
       BUSINESS CARDS
    ========================= */

    .business-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .business-card {
      overflow: hidden;
      background: #111422;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
    }

    .business-image {
      height: 180px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(236,72,153,.3), transparent 40%),
        linear-gradient(135deg, #17192a, #21152b);
      color: #c4b5fd;
      font-weight: 900;
      letter-spacing: .15em;
    }

    .business-content {
      padding: 20px;
    }

    .business-meta {
      display: flex;
      justify-content: space-between;
      color: #8f94a7;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .business-content h3 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .business-content p {
      color: #9498aa;
      line-height: 1.55;
      margin: 0 0 17px;
    }

    /* =========================
       PAGE HEADER
    ========================= */

    .page {
      padding: 55px 0;
    }

    .page-header {
      margin-bottom: 30px;
    }

    .page-header p {
      color: #969bad;
      font-size: 17px;
      line-height: 1.6;
      max-width: 650px;
    }

    /* =========================
       BUSINESS DETAIL
    ========================= */

    .back-button {
      background: transparent;
      border: 0;
      color: #b7a8ff;
      padding: 0;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .detail-image {
      height: 280px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background:
        radial-gradient(circle at 30% 20%, rgba(139,92,246,.4), transparent 40%),
        linear-gradient(135deg, #15182a, #27172b);
      font-weight: 900;
      letter-spacing: .2em;
      margin-bottom: 25px;
    }

    .detail h1 {
      font-size: clamp(35px, 6vw, 58px);
      margin: 0 0 10px;
      letter-spacing: -.04em;
    }

    .muted {
      color: #9297aa;
    }

    /* =========================
       BOOKING FORM
    ========================= */

    .booking-panel {
      max-width: 700px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      background: #111422;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 9px;
      font-weight: 700;
    }

    .form-input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: #090b16;
      color: white;
      outline: none;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .time-button {
      padding: 12px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.09);
      background: #191c2a;
      color: white;
    }

    .time-button.selected {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-color: transparent;
    }

    /* =========================
       CONFIRMATION
    ========================= */

    .confirmation {
      max-width: 650px;
      margin: 50px auto;
      text-align: center;
    }

    .confirmation-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      font-size: 32px;
      font-weight: 900;
    }

    .confirmation h1 {
      font-size: 48px;
      margin: 0 0 15px;
    }

    .confirmation-card {
      text-align: left;
      margin: 30px 0;
      padding: 22px;
      border-radius: 20px;
      background: #111422;
      border: 1px solid rgba(255,255,255,.08);
    }

    .confirmation-card div {
      padding: 8px 0;
      color: #a2a6b7;
    }

    .confirmation-card strong {
      color: white;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      text-align: center;
      padding: 70px 20px;
      border: 1px dashed rgba(255,255,255,.12);
      border-radius: 22px;
      color: #9297aa;
    }

    .empty h2 {
      color: white;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 15px;
      transform: translateX(-50%);
      z-index: 100;
      width: min(560px, calc(100% - 30px));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 7px;
      background: rgba(17,20,34,.94);
      border: 1px solid rgba(255,255,255,.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .nav-button {
      border: 0;
      border-radius: 14px;
      padding: 10px;
      background: transparent;
      color: #85899b;
    }

    .nav-button span {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .nav-button small {
      font-size: 11px;
    }

    .nav-button.active {
      color: white;
      background: rgba(139,92,246,.18);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 800px) {
      .category-grid,
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .business-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .container {
        width: min(100% - 22px, 1180px);
      }

      .hero {
        padding-top: 45px;
      }

      .category-grid,
      .cards {
        grid-template-columns: 1fr;
      }

      .time-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1,
      .page-header h1 {
        font-size: 46px;
      }
    }
  </style></head><body><div id="app"></div><script>

  /* ==========================================

  ========================================== */

  function saveBookings() {
    localStorage.setItem(
      "booked_bookings",
      JSON.stringify(bookings)
    );
  }

  function formatDate(value) {
    if (!value) return "";

    const date = new Date(value + "T12:00:00");

    return date.toLocaleDateString(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    });
  }

  function today() {
    return new Date().toISOString().split("T")[0];
  }

  function escapeHTML(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  /* ==========================================

  function renderHome() {

    return shell(`

        <section class="section">

          <div class="section-heading">
            <div>
              <p class="eyebrow">
