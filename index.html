<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booked by IntelliStack</title>
    
    <!-- Link your icons -->
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />

    <!-- Link your CSS files in the correct order -->
    <link rel="stylesheet" href="variables.css"> <!-- Colors/globals -->
    <link rel="stylesheet" href="global.css">    <!-- Resets/base styles -->
    <link rel="stylesheet" href="components.css"> <!-- Toolbar, buttons, cards -->
    <link rel="stylesheet" href="styles.css">    <!-- Main layout/sections -->
    <link rel="stylesheet" href="responsive.css"> <!-- Mobile/Desktop tweaks -->
</head>
<body>

    <!-- 1. FIXED TOP TOOLBAR -->
    <nav class="top-toolbar">
        <a href="#" class="active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </a>
        <!-- ... rest of your toolbar links ... -->
    </nav>

    <!-- 2. HERO SECTION -->
    <header class="hero-section">
        <img src="photo4.png" alt="Booked by IntelliStack Logo" class="hero-banner">
        
        <div class="hero-text">
            <h2>Real People. Real Services. Real Time.</h2>
            <p>Discover the people and places that help you <span>feel your best.</span></p>
        </div>

        <div class="search-container">
            <input type="text" placeholder="Search restaurants, barbers, salons...">
            <button class="search-btn">➔</button>
        </div>
    </header>

    <!-- 3. MAIN CONTENT CONTAINER -->
    <main id="app">
        <!-- Your router (router.js) will likely inject the page content here based on the active tab! -->
    </main>

    <!-- Link your JavaScript files at the end of the body -->
    <script src="variables.css"></script> <!-- Oops, this is JS, not CSS. Let's fix this in the next section -->
    
    <script src="state.js"></script>
    <script src="router.js"></script>
    <script src="app.js"></script>
</body>
</html>
