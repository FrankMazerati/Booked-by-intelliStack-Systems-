<!-- AI FLOATING CHAT LAUNCHER WITH VIBE ALERT -->
<div class="chat-launcher-wrapper">
  <div class="chat-vibe-pill" onclick="toggleChat()">
    CLICK TO VIBE ✨
  </div>
  <button class="chat-launcher" onclick="toggleChat()">
    💬
  </button>
</div>

<!-- EXPANDABLE CHAT MODAL -->
<div id="chatModal" class="chat-modal">
  <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div class="logo-badge" style="width: 24px; height: 24px; font-size: 0.7rem;">✓</div>
      <div>
        <strong style="font-size: 0.85rem; display: block; line-height: 1.1;">BOOK'D AI Bot</strong>
        <span style="font-size: 0.65rem; color: var(--neon-blue);">Online • City Navigator</span>
      </div>
    </div>
    <span style="cursor: pointer; font-size: 1.2rem; padding: 4px;" onclick="toggleChat()">✕</span>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-bubble bot">
      Yo! What’s the move today? I can help you find open slots, matched vibes, or lock down a booking anywhere in your city. ⚡
    </div>
  </div>
</div>
